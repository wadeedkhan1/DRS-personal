# Port 80: ACME challenges and a redirect. Nothing else is served here.
server {
    listen 80;
    server_name _;

    # Certbot writes its challenge files into this shared webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # init_certs.sh puts a self-signed placeholder here on first run so nginx can
    # start; certbot replaces it with a real certificate. Without the placeholder
    # nginx refuses to load this block at all and the whole stack fails to come up.
    ssl_certificate     /etc/letsencrypt/live/drs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signaling sockets: /ws/agent (devices), /ws/session (viewers), /ws/presence.
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required, and easy to miss. A browser cannot set an Authorization header on a
        # WebSocket, so the viewer's JWT travels in Sec-WebSocket-Protocol. nginx does
        # not forward that header by default, and without it every browser socket is
        # rejected as unauthenticated while the agent sockets keep working — a confusing
        # failure to debug from the portal side.
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The backend reads the device's real address from here; without it every
        # device would be recorded at the proxy's address.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent sockets are long-lived and mostly idle between heartbeats. The backend
        # does its own liveness detection, so nginx should not be the thing that decides
        # a quiet connection is dead.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://backend:8080/health;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
